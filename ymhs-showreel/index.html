<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>梅岡時光機</title>
<meta name="description" content="楊梅高中 1948–2026 空照與衛星影像變遷：互動式動態圖文教學短片（單一 HTML＋內嵌 SVG）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --cream:#FFF6E5; --navy:#1F2A56; --coral:#FF6F61; --sun:#FFC93C; --mint:#4FD1A5; --sky:#4FB3E8;
  --ui-bg:#141a33; --ui-fg:#f4f6ff; --ui-dim:#9aa3c7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-fg);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#viewport{flex:1;position:relative;overflow:hidden;background:#0d1226}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--cream)}
#stage svg{display:block;width:1920px;height:1080px}
svg text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.num{font-family:"Baloo 2","Noto Sans TC",sans-serif}

#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
  background:rgba(13,18,38,.55);backdrop-filter:blur(2px);cursor:pointer;z-index:5}
#cover button{font:inherit;font-size:22px;font-weight:900;border:0;border-radius:999px;padding:18px 34px;
  background:var(--coral);color:#fff;box-shadow:0 8px 0 #c94a3e;cursor:pointer}
#cover p{margin:0;color:#dfe5ff;font-size:15px;text-align:center;padding:0 16px;line-height:1.6}
#cover.hidden{display:none}

#controls{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--ui-bg);flex-wrap:wrap}
#controls button{font:inherit;font-size:14px;font-weight:700;border:1px solid #2c3561;background:#1d2547;color:var(--ui-fg);
  border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
#controls button[aria-pressed="false"]{color:var(--ui-dim);text-decoration:line-through}
#controls button:hover{border-color:#4a5799}
#playBtn{min-width:44px;background:var(--coral)!important;border-color:var(--coral)!important}
#time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ui-dim);min-width:104px}
#seekWrap{position:relative;flex:1 1 260px;min-width:180px;height:30px;display:flex;align-items:center}
#seek{width:100%;accent-color:var(--coral);position:relative;z-index:2}
#ticks{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
#ticks span{position:absolute;top:3px;width:2px;height:8px;background:var(--sun);border-radius:1px}
#chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px;background:var(--ui-bg)}
#chips button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:5px 11px;background:#232c55;color:#cfd6ff;cursor:pointer}
#chips button.on{background:var(--sun);color:#3a2a00}
label.vol{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ui-dim)}
label.vol input{width:80px;accent-color:var(--mint)}

#drawer{position:absolute;right:0;top:0;bottom:0;width:min(380px,100%);background:#f9f3e6;color:var(--navy);z-index:6;
  transform:translateX(100%);transition:transform .25s ease;overflow:auto;padding:18px 18px 30px;box-shadow:-8px 0 24px rgba(0,0,0,.35)}
#drawer.open{transform:none}
#drawer h2{margin:0 0 6px;font-size:20px}
#drawer p{font-size:13px;line-height:1.6;margin:6px 0 12px;color:#4a4f6a}
#drawer .row{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed #d8cdb6}
#drawer .row b{font-size:15px}
#drawer .row small{display:block;font-size:11px;color:#7a7f99;font-weight:500}
#drawer input[type=file]{font-size:12px;width:100%}
#drawer .row button{font:inherit;font-size:12px;border:1px solid #c9bda4;background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer}
#drawer .close{float:right;font:inherit;font-size:20px;border:0;background:none;cursor:pointer;color:var(--navy)}
#drawer label.mix{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700;margin:6px 0 10px}
#drawer label.mix input{flex:1;accent-color:var(--coral)}
@media (max-width:640px){#controls{gap:6px;padding:6px 8px}#controls button{padding:6px 8px;font-size:13px}label.vol{display:none}}
</style>
</head>

<script>
"use strict";
/* =========================================================
   梅岡時光機 — deterministic render(t), 180 s, 30 fps
   ========================================================= */
const FPS = 30, DUR = 180, BAR = 2.5, STEP = BAR / 16;
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const spring = u => u <= 0 ? 0 : 1 - Math.exp(-6 * u) * Math.cos(11 * u);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mixHex(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, k)), g = Math.round(lerp(pa >> 8 & 255, pb >> 8 & 255, k)), bl = Math.round(lerp(pa & 255, pb & 255, k));
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}

/* ---------------- 內容（校史資料 + 判讀教學） ---------------- */
const CH = [
  { year: 1948, tag: "CH.01 序章", title: "楊梅初中創校", src: "老地圖・早期航照（示意）",
    facts: ["民國37年8月 縣立楊梅初中創校", "民國40年 增設高中部", "更名為「縣立楊梅中學」"],

function newSession(t) {
  stopSession();
  const m = AC.createGain(), s = AC.createGain(), rv = AC.createGain();
  m.connect(musicVol); s.connect(sfxVol); rv.connect(revIn);
  sess = { m, s, rv, ctx0: AC.currentTime + 0.05 - t, from: t };
}
function stopSession() {
  if (!sess) return;
  const old = sess, now = AC.currentTime; sess = null;
  [old.m, old.s, old.rv].forEach(g => { g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); g.gain.linearRampToValueAtTime(0, now + .06); });
  setTimeout(() => [old.m, old.s, old.rv].forEach(g => g.disconnect()), 400);
}
function osc(type, f, when, dur, vol, dest, o = {}) {
  const n = AC.createOscillator(); n.type = type; n.frequency.setValueAtTime(f, when);
  if (o.f2) n.frequency.exponentialRampToValueAtTime(o.f2, when + (o.ft || dur));
  if (o.detune) n.detune.value = o.detune;
  const g = AC.createGain(), a = o.a || .004;
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + a);
  if (o.sus) { g.gain.setValueAtTime(vol, when + dur - (o.rel || .3)); g.gain.linearRampToValueAtTime(0.0001, when + dur); }
  else g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  let node = n;
  if (o.lp) { const f1 = AC.createBiquadFilter(); f1.type = "lowpass"; f1.frequency.value = o.lp; n.connect(f1); node = f1; }
  node.connect(g); g.connect(dest);
  if (o.rev) { const r = AC.createGain(); r.gain.value = o.rev; g.connect(r); r.connect(sess.rv); }
  n.start(when); n.stop(when + dur + .05);
}
function noise(when, dur, vol, dest, o = {}) {
  const n = AC.createBufferSource(); n.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = o.type || "bandpass"; f.frequency.setValueAtTime(o.f || 2000, when); f.Q.value = o.q || 1;
  if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, when + (o.ft || dur));
  if (o.f3) f.frequency.exponentialRampToValueAtTime(o.f3, when + dur);
  const g = AC.createGain(), a = o.a || .003;
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + a); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  n.connect(f); f.connect(g); g.connect(dest);
  if (o.rev) { const r = AC.createGain(); r.gain.value = o.rev; g.connect(r); r.connect(sess.rv); }
  n.start(when, (o.off || 0) % 1.5); n.stop(when + dur + .05);
}
/* instruments */
function pad(tones, when, dur, L) {
  const lp = [0, 900, 1100, 1300, 1500, 1900, 1400][L], vol = [0, .05, .05, .045, .045, .05, .06][L];
  tones.forEach(m => [-8, 8].forEach(d => osc("sawtooth", mtof(m + 12), when, dur, vol / 2, sess.m, { a: .6, sus: 1, rel: .9, detune: d, lp, rev: .5 })));
}
const pluck = (m, w, v) => { osc("triangle", mtof(m), w, .45, v, sess.m, { rev: .25 }); osc("sine", mtof(m + 12), w, .25, v * .3, sess.m); };
const bell = (m, w, v, d = 1.4) => { osc("sine", mtof(m), w, d, v, sess.m, { rev: .6 }); osc("sine", mtof(m) * 2.76, w, d * .4, v * .25, sess.m); };
const kick = (w, v) => osc("sine", 120, w, .28, v, sess.m, { f2: 42, ft: .12 });
const clap = (w, v) => noise(w, .16, v, sess.m, { f: 1700, q: .8, rev: .3 });
const shaker = (w, v) => noise(w, .05, v, sess.m, { type: "highpass", f: 6500 });
const tick = (w, v) => osc("square", 2200, w, .03, v, sess.m, { lp: 4000 });
const bass = (m, w, v) => osc("triangle", mtof(m - 12), w, .36, v, sess.m, { lp: 500 });

function musicStep(k, when) {
  const x = k * STEP; if (x >= 179.5) return;
  const bar = Math.floor(k / 16), s = k % 16, L = lvl(x);
  const cname = OVR[bar] || PROG[bar % 4], tones = CHORD[cname];
  const arpT = [tones[0] + 12, tones[1] + 12, tones[2] + 12, tones[0] + 24];
  if (L === 6) {
    if (bar === 70) {
      if (s === 0) { pad(tones, when, 4.4, 6); bell(77, when, .1, 3); bass(41 + 12, when, .16); }
      if (s === 2) bell(81, when, .08, 2.8); if (s === 4) bell(84, when, .07, 2.6); if (s === 6) bell(89, when, .06, 2.4);
      return;
    }
    if (bar > 70) return;
    if (s === 0) { pad(tones, when, BAR + .3, 6); bass(tones[0], when, .15); }
    if (bar === 67 && s === 0) { bell(77, when, .1, 2); kick(when, .5); noise(when, 1.6, .18, sess.m, { type: "highpass", f: 5000, rev: .6 }); }
    if (s % 2 === 0) pluck(arpT[(s / 2) % 4], when, .06);
    const mn = MEL[bar % 4][s]; if (mn) bell(mn, when, .07);
    return;
  }
  if (s === 0) pad(tones, when, BAR + .4, L);
  if (L === 1 && (s === 0 || s === 8)) bell(tones[(bar + s / 8) % 3] + 24, when, .06, 2);
  if (L >= 2) {
    if (L === 5 || s % 2 === 0) pluck(arpT[(L === 5 ? s : s / 2) % 4], when, L === 5 ? .045 + .03 * ((x - 150) / 17.5) : .055);
    if (s % 4 === 0) tick(when, L >= 3 ? .018 : .025);
  }
  if (L >= 3) {
    if (s === 0 || s === 8 || (L === 5 && s % 4 === 0)) kick(when, .55);
    if (s === 4 || s === 12) clap(when, .16);
    if (L === 3 ? s % 2 === 0 : true) shaker(when, s % 4 === 2 ? .07 : .035);
    if ([0, 3, 6, 8, 11, 14].includes(s)) bass(tones[0], when, .17);
  }
  if (L >= 4) { const mn = MEL[bar % 4][s]; if (mn) bell(mn + (L === 5 ? 12 : 0), when, .06); }
  if (L === 5 && bar === 66 && s >= 8) noise(when, .08, .04 + (s - 8) * .015, sess.m, { f: 1800 + s * 120, q: .7 });
}
/* SFX */
function pageFlip(w) { noise(w, .22, .5, sess.s, { f: 1100, f2: 4200, ft: .18, q: .9 }); noise(w + .11, .09, .25, sess.s, { type: "highpass", f: 2600 }); noise(w + .02, .3, .12, sess.s, { type: "lowpass", f: 600, off: .3 }); }
function whoosh(w, d = .8, rev) { noise(w, d, .45, sess.s, { type: "lowpass", f: rev ? 5000 : 300, f2: rev ? 400 : 5000, ft: d * .6, f3: rev ? 300 : 700, q: 2, a: d * .4, rev: .4 }); }
function shutter(w) { noise(w, .035, .4, sess.s, { type: "highpass", f: 3000 }); noise(w + .07, .05, .35, sess.s, { type: "highpass", f: 2400 }); }
function pop(w, f = 700) { osc("sine", f, w, .14, .22, sess.s, { f2: f * 2, ft: .07 }); }
function chime(w) { [77, 81, 84, 89].forEach((m, i) => osc("sine", mtof(m), w + i * .07, 1.2, .1, sess.s, { rev: .7 })); }
function rewind(w) { osc("sawtooth", 1400, w, .9, .07, sess.s, { f2: 160, ft: .85, lp: 2500 }); whoosh(w, .9, true); }
function sparkle(w) { [0, 1, 2, 3, 4].forEach(i => osc("sine", 2000 + i * 330, w + i * .05, .25, .05, sess.s, { rev: .5 })); }

const SFX = [];
(function buildSfx() {
  SFX.push([0.0, w => whoosh(w, 1.0)], [1.5, chime], [2.3, w => pop(w, 600)], [4.25, w => pop(w, 500)], [5.0, w => pop(w, 800)], [7.0, w => whoosh(w, 1.2)], [9.6, w => whoosh(w, .9)], [10.4, pageFlip], [10.9, shutter]);
  SEGS.forEach(s => {
    if (s.k === "howto") SFX.push([s.t0, pageFlip], [s.t0 + .35, w => pop(w, 650)], [s.t0 + .55, w => pop(w, 820)]);
    if (s.k === "ch") SFX.push([s.t0, pageFlip], [s.t0 + .5, shutter], [s.t0 + .35, w => pop(w, 650)], [s.t0 + .6, w => pop(w, 820)], [s.t0 + 1.95, w => pop(w, 980)]);
  });
  SFX.push([150.1, rewind]);
  for (let i = 0; i < 9; i++) SFX.push([RECAP_T(i), pageFlip]);
  SFX.push([167.5, sparkle], [167.8, w => pop(w, 600)], [168.7, w => pop(w, 760)], [170.7, w => pop(w, 900)], [171.5, w => pop(w, 700)], [171.95, w => pop(w, 800)], [172.4, w => pop(w, 900)]);
  SFX.sort((a, b) => a[0] - b[0]);
})();

function schedule(from, to) {
  if (!sess) return;
  const now = AC.currentTime;
  const k0 = Math.ceil(from / STEP - 1e-6), k1 = Math.ceil(to / STEP - 1e-6);
  for (let k = k0; k < k1; k++) { const w = sess.ctx0 + k * STEP; if (w >= now - .01) musicStep(k, Math.max(w, now)); }
  if (sfxOn) for (const [x, fn] of SFX) if (x >= from && x < to) { const w = sess.ctx0 + x; if (w >= now - .02) fn(Math.max(w, now)); }
}

/* =========================================================
   旁白：Web Speech（瀏覽器預設語音）
   ========================================================= */
let narrOn = true, spokenSeg = -1;
const SPEECH = "speechSynthesis" in window;
function speak(text) {
  if (!SPEECH) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-TW"; u.rate = 1.15; u.pitch = 1.05; u.volume = 1;
  u.onstart = () => { if (duck) duck.gain.setTargetAtTime(.45, AC.currentTime, .1); };
  u.onend = u.onerror = () => { if (duck) duck.gain.setTargetAtTime(1, AC.currentTime, .3); };
  speechSynthesis.speak(u);
}
function narrTick(t) {
  const i = segAt(t);
  if (i === spokenSeg) return;
  spokenSeg = i;
  const s = SEGS[i];
  if (narrOn && t - s.t0 < (s.t1 - s.t0) * 0.35) speak(s.narr);
}
function stopSpeech() { if (SPEECH) speechSynthesis.cancel(); if (duck && AC) duck.gain.setTargetAtTime(1, AC.currentTime, .1); }

/* =========================================================
   播放控制
   ========================================================= */
let T = 0, playing = false, schedTo = 0, perf0 = 0;
function clockNow() { return AC ? AC.currentTime - sess.ctx0 : (performance.now() - perf0) / 1000; }
function play() {
  if (T >= DUR - 0.05) T = 0;
  try { initAudio(); AC.resume(); newSession(T); } catch (e) { AC = null; perf0 = performance.now() - T * 1000; }
  playing = true; schedTo = T; spokenSeg = -1;
  if (SPEECH) speechSynthesis.cancel();
  $("cover").classList.add("hidden");
  $("playBtn").textContent = "❚❚"; $("playBtn").setAttribute("aria-label", "暫停");
  requestAnimationFrame(loop);
}
function pause() {
  playing = false; stopSession(); stopSpeech();
  $("playBtn").textContent = "▶"; $("playBtn").setAttribute("aria-label", "播放");
}
function seek(t) {
  T = clamp(t, 0, DUR);
  if (playing) { newSession(T); schedTo = T; spokenSeg = -1; stopSpeech(); }
  draw();
}
function loop() {
  if (!playing) return;
  T = sess || !AC ? clockNow() : T;
  if (T >= DUR) { T = DUR; draw(); pause(); return; }
  if (AC && sess) { const to = T + .3; if (to > schedTo) { schedule(schedTo, to); schedTo = to; } }
  narrTick(T);
  draw();
  requestAnimationFrame(loop);
}
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
let chipOn = -1;
function draw() {
  render(T);
  $("time").textContent = `${fmt(T)} / ${fmt(DUR)}`;
  if (document.activeElement !== $("seek")) $("seek").value = T;
  const i = segAt(T);
  if (i !== chipOn) { chipOn = i; document.querySelectorAll("#chips button").forEach((b, k) => b.classList.toggle("on", k === i)); }
}

/* UI wiring */
function fit() {
  const vp = $("viewport"), w = vp.clientWidth, h = vp.clientHeight, s = Math.min(w / 1920, h / 1080);
  $("stage").style.transform = `translate(${(w - 1920 * s) / 2}px,${(h - 1080 * s) / 2}px) scale(${s})`;
}
window.addEventListener("resize", fit);
$("bigPlay").onclick = e => { e.stopPropagation(); play(); };
$("cover").onclick = () => play();
$("playBtn").onclick = () => playing ? pause() : play();
$("seek").addEventListener("input", e => seek(+e.target.value));
function toggleBtn(id, get, set) { $(id).onclick = () => { set(!get()); $(id).setAttribute("aria-pressed", get()); draw(); }; }
toggleBtn("narrBtn", () => narrOn, v => { narrOn = v; if (!v) stopSpeech(); });
toggleBtn("capBtn", () => capOn, v => capOn = v);
toggleBtn("sfxBtn", () => sfxOn, v => sfxOn = v);
$("vol").oninput = e => { if (musicVol) musicVol.gain.value = +e.target.value; };
$("fsBtn").onclick = () => { const a = $("app"); document.fullscreenElement ? document.exitFullscreen() : a.requestFullscreen && a.requestFullscreen(); };
$("imgBtn").onclick = () => $("drawer").classList.toggle("open");
$("drawerClose").onclick = () => $("drawer").classList.remove("open");
$("mix").oninput = e => { realMix = +e.target.value; draw(); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  if (e.code === "ArrowRight") seek(T + 5);
  if (e.code === "ArrowLeft") seek(T - 5);
});
(function buildUI() {
  const chips = $("chips"), ticks = $("ticks");
  const names = { intro: "片頭", howto: "怎麼讀", recap: "快轉回顧", outro: "片尾" };
  SEGS.forEach(s => {
    const b = document.createElement("button"); b.type = "button";
    b.textContent = s.k === "ch" ? `${CH[s.i].year}` : names[s.k];
    b.onclick = () => seek(s.t0 + 0.001);
    chips.appendChild(b);
    const tk = document.createElement("span"); tk.style.left = `calc(${(s.t0 / DUR * 100).toFixed(2)}% - 1px)`; ticks.appendChild(tk);
  });
  const rows = $("rows");
  CH.forEach((c, i) => {
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<b>${c.year}<small>民國${c.year - 1911}年</small></b><input type="file" accept="image/*" aria-label="${c.year} 年影像"><button type="button">清除</button>`;
    const inp = r.querySelector("input");
    inp.onchange = () => { const f = inp.files[0]; if (!f) return; if (realImgs[i]) URL.revokeObjectURL(realImgs[i]); realImgs[i] = URL.createObjectURL(f); draw(); };
    r.querySelector("button").onclick = () => { if (realImgs[i]) URL.revokeObjectURL(realImgs[i]); delete realImgs[i]; inp.value = ""; draw(); };
    rows.appendChild(r);
  });
})();

/* test / still hook: ?t=秒 */
window.render = render; window.DUR = DUR; window.FPS = FPS;
const qt = new URLSearchParams(location.search).get("t");
fit();
if (qt !== null) { T = +qt; $("cover").classList.add("hidden"); }
draw();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { draw(); window.READY = true; });
</script>
</body>
